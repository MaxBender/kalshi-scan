name: Kalshi scan

on:
  schedule:
    # GitHub cron is UTC. 13:37 UTC = 8:37am ET, 00:37 UTC = 7:37pm ET (during EST; one hour later in EDT).
    - cron: "37 13 * * *"
    - cron: "37 0 * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test notification even if nothing is flagged"
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run scanner
        id: scan
        run: |
          python kalshi_scan.py --min-edge 3 --no-spreads --top 5 > flags.txt
          cat flags.txt
          if [ -s flags.txt ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi

      - name: Notify via ntfy
        if: steps.scan.outputs.found == 'true' || inputs.test_alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC secret not set; skipping alert"; exit 0; fi
          if [ -s flags.txt ]; then
            BODY="$(cat flags.txt)

          Top-of-book prices only; check depth and confirm brackets list every outcome."
          else
            BODY="Test alert: scanner ran, nothing flagged."
          fi
          curl -sS -H "Title: Kalshi scan flags" -H "Tags: chart_with_upwards_trend" \
            --data-binary "$BODY" "https://ntfy.sh/$NTFY_TOPIC"
