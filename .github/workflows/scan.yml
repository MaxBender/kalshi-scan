name: Kalshi scan

on:
  schedule:
    # Hourly at :37 (UTC minute = ET minute, so daylight saving doesn't matter).
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test notification even if nothing is flagged"
        type: boolean
        default: false
      selftest:
        description: "Only run the order-book self-test (no scan, no results commit)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Self-test
        if: inputs.selftest
        run: python kalshi_scan.py --selftest

      - name: Run scanner
        id: scan
        if: ${{ !inputs.selftest }}
        run: |
          python kalshi_scan.py --min-edge 3 --no-spreads --max-days 90 --min-profit 10 --top 10 > flags.txt
          cat flags.txt
          if [ -s flags.txt ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
          if grep -q "SIGNIFICANT" flags.txt; then echo "significant=true" >> "$GITHUB_OUTPUT"; else echo "significant=false" >> "$GITHUB_OUTPUT"; fi

      - name: Save results for Claude
        if: ${{ always() && !inputs.selftest }}
        run: |
          mkdir -p results
          {
            echo "scanned_at_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "status: ${{ steps.scan.outcome }}"
            echo "---"
            cat flags.txt 2>/dev/null || true
          } > results/latest.txt
          git config user.name "kalshi-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/latest.txt
          git commit -m "Scan results $(date -u +%Y-%m-%dT%H:%MZ)" || true
          git push || true

      - name: Notify via ntfy
        if: steps.scan.outputs.significant == 'true' || inputs.test_alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC secret not set; skipping alert"; exit 0; fi
          if grep -q "SIGNIFICANT" flags.txt; then
            BODY="$(grep -A2 SIGNIFICANT flags.txt)

          Top-of-book prices only; check depth and confirm brackets list every outcome."
          else
            BODY="Test alert: scanner ran, nothing flagged."
          fi
          curl -sS -H "Title: Kalshi scan flags" -H "Tags: chart_with_upwards_trend" \
            --data-binary "$BODY" "https://ntfy.sh/$NTFY_TOPIC"
